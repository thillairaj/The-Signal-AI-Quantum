name: Update feed data

on:
  schedule:
      - cron: "09 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest articles
        run: python3 scripts/fetch_feeds.py

      - name: Commit updated data
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/articles.json feed.xml
          git diff --quiet --cached || git commit -m "Auto-update: refresh 24h window $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push || (git pull --rebase && git push)
